{% extends "base.html" %}
{% block title %}Log in — RoadSense{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="auth-road" aria-hidden="true"><span></span></div>
  <div class="auth-card" data-reveal>
    <h1>Log in to RoadSense</h1>
    <p>Welcome back. Log in to report hazards and view your reports.</p>
    <form method="post" action="{{ url_for('login') }}" class="auth-form" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <label>
        Username
        <input
          type="text"
          name="username"
          required
          autocomplete="username"
        />
      </label>
      <label>
        Password
        <input
          type="password"
          name="password"
          required
          autocomplete="current-password"
        />
      </label>
      <button class="btn btn-primary" type="submit">Log in</button>
    </form>
    <p class="auth-alt">No account yet? <a href="{{ url_for('register') }}">Register</a></p>
  </div>
</section>
{% endblock %}
