{% extends "base.html" %}
{% block title %}Register — RoadSense{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="auth-road" aria-hidden="true"><span></span></div>
  <div class="auth-card" data-reveal>
    <h1>Create your account</h1>
    <p>An account lets you report hazards and track your submissions.</p>
    <form method="post" action="{{ url_for('register') }}" class="auth-form" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <label>
        Username
        <input
          type="text"
          name="username"
          required
          minlength="3"
          maxlength="32"
          autocomplete="username"
        />
      </label>
      <label>
        Password
        <input
          type="password"
          name="password"
          required
          minlength="8"
          autocomplete="new-password"
        />
      </label>
      <p class="field-hint">At least 8 characters.</p>
      <button class="btn btn-primary" type="submit">Create account</button>
    </form>
    <p class="auth-alt">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</section>
{% endblock %}
